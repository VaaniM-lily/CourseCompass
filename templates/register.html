{% extends "base.html" %}
{% block title %}Create Account | CourseCompass{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Create your account</h1>
  <p class="muted">Start discovering courses matched to your goals.</p>
  <form method="POST" class="form">
    <label>Name</label><input type="text" name="name" required placeholder="Your full name">
    <label>Email</label><input type="email" name="email" required placeholder="you@example.com">
    <label>Password</label><input type="password" name="password" required minlength="6">
    <label>Confirm password</label><input type="password" name="confirm_password" required minlength="6">
    <button class="btn btn-primary full" type="submit">Create Account</button>
  </form>
  <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</section>
{% endblock %}
