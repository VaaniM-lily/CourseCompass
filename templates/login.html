{% extends "base.html" %}
{% block title %}Login | CourseCompass{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Welcome back</h1>
  <p class="muted">Log in to continue your learning journey.</p>
  <form method="POST" class="form">
    <label>Email</label><input type="email" name="email" required>
    <label>Password</label><input type="password" name="password" required>
    <button class="btn btn-primary full" type="submit">Login</button>
  </form>
  <p class="auth-switch">New to CourseCompass? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
